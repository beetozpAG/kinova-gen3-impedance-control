# KINOVA CHANGE (3/3): Hand geometry for the Robotiq 2F-85 gripper
# (mounted on a Kinova Gen3). Units: meters.
#
# How GPD sees the hand (see readme/hand_frame.png):
#   A "U" shape: a palm and two straight, parallel fingers.
#   finger_width        = thickness of one finger (in the closing direction)
#   hand_outer_diameter = distance between the OUTER faces of the open fingers
#   hand_depth          = finger length, from the palm to the finger tip
#   hand_height         = finger width (seen from the side)
#   init_bite           = minimum part of the object that must be between the fingers
#
# Why hand_depth = 0.038 (pad length only), step by step:
#   1. The 2F-85 fingers are linkages. Only the pad (38 mm) is straight and parallel.
#   2. Open, the depth from palm to tip is 61.3 mm (149.3 - 88).
#      Closed, it is 74.8 mm (162.8 - 88), because the pads move up while closing.
#   3. If the object goes deep, the pads rise above it and the linkages wrap it.
#      The object is held, but its pose in the hand is unknown.
#   4. With 0.038, GPD only proposes fingertip grasps: the object pose in the
#      hand stays known (needed later to insert the part in a hole).
#   If GPD finds too few grasps, try hand_depth = 0.061.
#
# Two fingertip options. Use the one that matches the pads on your gripper.

# --- Option A (ACTIVE): flat silicone pads (AGC-TIP-204-085) ---
# Source: Robotiq 2F-85 manual, 2019 online version, section 6, Fig. 6-1.
# Our gripper was bought more than 6 years ago, so it likely has these pads.
#   Open: inner faces 85 mm, outer faces 98 mm, pad 38 x 22 mm.
finger_width = 0.0065
hand_outer_diameter = 0.098
hand_depth = 0.038
hand_height = 0.022
init_bite = 0.01

# --- Option B (inactive): NBR overmolded rubber pads (AGC-TIP-MLD-85) ---
# Source: Documents/Dimensions Gripper 2-Finger 85.pdf, Fig. 5-1.
#   Open: inner faces 85 mm, outer faces 100.6 mm, pad 38 x 22 mm.
# To use it: comment out Option A and remove the "#" below.
