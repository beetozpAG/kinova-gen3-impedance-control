# Camera mount: where the vision module is on the wrist (read by
# src/0_Input/frames.cpp: colorToInt, depthToInt). Used by every program that
# moves a point from the camera to BASE, or from DEPTH to COLOR.
# No need to compile again after a change.
#
# color_position_mm   origin of COLOR seen from INT: x y z [mm]
# color_rotation_deg  rotation of COLOR in INT: x-y-z extrinsic [deg]
#                     (R = Rz * Ry * Rx, the convention of tool_pose)
# depth_from_color_mm origin of DEPTH seen from COLOR: x y z [mm]; both
#                     sensors are on the same board of the module (factory),
#                     so this one is not calibrated
#
# Values of the manual: user guide r12.0, Table 92, p.225 (COLOR at
# 0, 56.39, -3.05 mm; DEPTH at 27.50, 66.00, -3.05 mm; no rotation).
#
# To change them: run the calibration (src/Calibration/README.md); it writes
# FOLDER/camera_calibration_suggested.cfg. Copy its lines here, and keep the
# old ones commented with the reason, e.g.:
#   # color_position_mm = 0.00 56.39 -3.05   (manual; replaced 2026-11-03,
#   #   tsai on calib_0311_101500: board spread 3.1 -> 0.8 mm)
#   color_position_mm = 1.40 61.20 -2.10
#color_position_mm = 0.00 56.39 -3.05
color_position_mm = 0.73 56.99 -2.83
#color_rotation_deg = 0.000 0.000 0.000
color_rotation_deg = -0.534 0.359 0.397

depth_from_color_mm = 27.50 9.61 0.00
