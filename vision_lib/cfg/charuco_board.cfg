# ChArUco board of the camera calibration (read by
# src/Calibration/charuco_board.cpp: readBoardSize).
# The board is printed by ./calib_board (charuco_board.pdf): 7 x 5 squares,
# DICT_4X4_50, printed at square 30.0 mm and marker 22.0 mm.
#
# The printer can shrink it a little, so write the sizes MEASURED on the
# printed sheet:
#   square_mm: measure 5 squares in a row (from the edge of the first to
#              the edge of the fifth) and divide by 5. Do it along the
#              columns and along the rows; if they differ by more than
#              0.2 mm, the printer stretched the sheet: print it again.
#   marker_mm: the black square of one marker, or square_mm * 22 / 30.
# A wrong square size scales the board, so the camera height comes out
# wrong by the same ratio (1% -> 4 mm at 0.40 m).
square_mm = 30.0
marker_mm = 22.0
