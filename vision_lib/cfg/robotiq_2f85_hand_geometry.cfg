# Hand geometry of the Robotiq 2F-85 gripper, as GPD needs it. Units: meters.
# Read by GPD (file name given in cfg/gpd_params.cfg, hand_geometry_filename).
# Origin: copy of third_party/gpd/cfg/kinova_robotiq_2f85_hand_geometry.cfg,
#         with sources (document + page) added.
#
# How GPD sees the hand (see third_party/gpd/readme/hand_frame.png):
#   A "U" shape: a palm and two straight, parallel fingers.
#   finger_width        = thickness of one finger (in the closing direction)
#   hand_outer_diameter = distance between the OUTER faces of the open fingers
#   hand_depth          = finger length, from the palm to the finger tip
#   hand_height         = finger width (seen from the side)
#   init_bite           = minimum part of the object that must be between the fingers
# GPD models the hand fully OPEN, so the values are for the open gripper.
#
# Opening between the fingers = hand_outer_diameter - 2 * finger_width = 85 mm
# (the "85" in 2F-85). Source: 2F-85_2F-140_Instruction_Manual.pdf,
# Table 5-1 "Stroke", page 78.
#
# Why hand_depth = pad length only, step by step:
#   1. The 2F-85 fingers are linkages. Only the pad is straight and parallel.
#   2. Open, the depth from palm to tip is 61.3 mm (149.3 - 88).
#      Closed, it is 74.8 mm (162.8 - 88), because the pads move up while closing.
#      Sources: 2F-85_2F-140_Instruction_Manual.pdf, Fig. 5-1 (opened, page 64),
#      Fig. 5-2 (closed, page 65), Table 5-1 "Maximum height" 162.8 mm (page 78).
#   3. If the object goes deep, the pads rise above it and the linkages wrap it.
#      The object is held, but its pose in the hand is unknown.
#   4. With the pad length only, GPD only proposes fingertip grasps: the object
#      pose in the hand stays known.
#   If GPD finds too few grasps, try hand_depth = 0.061.
#
# Values: the manual values are kept below as a reference (commented),
# and the ACTIVE values are the ones measured on our gripper.
# GPD ignores everything after a "#" (config_file.cpp:7-8).

# --- Manual (reference) ---
# Source: 2F-85_2F-140_Instruction_Manual.pdf, Fig. 5-1, page 64
# (same drawing as Dimensions Gripper 2-Finger 85.pdf, page 1).
#   Open: inner faces 85 mm, outer faces 100.6 mm, pad 38 x 22 mm.
# finger_width = 0.0078
# hand_outer_diameter = 0.1006
# hand_depth = 0.038
# hand_height = 0.022
# init_bite = 0.01

# --- MEASURED on our gripper (ACTIVE) ---
# Measured 2026-10-14 with a vernier caliper, gripper fully open (position 0).
# Inner opening measured: 85 mm.
# Check: hand_outer_diameter - 2 * finger_width = 99.3 - 2 * 7.1 = 85.1 mm (OK).
finger_width = 0.0071         # 7.1 mm   (manual: 7.8)
hand_outer_diameter = 0.0993  # 99.3 mm  (manual: 100.6)
hand_depth = 0.0375           # 37.5 mm  (manual: 38)
hand_height = 0.0216          # 21.6 mm  (manual: 22)
init_bite = 0.01             # not measured: how deep the object must enter (kept)
