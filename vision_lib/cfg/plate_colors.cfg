# Color of each plate, as a range in HSV (read by src/2_GetROI/color_mask).
# A point of the cloud belongs to a plate if its color is inside the range
# of the plate. One line per plate; add a line for a new color (no need to
# compile again).
#
# HSV in OpenCV units (cv::cvtColor, BGR2HSV, 8-bit images):
#   H (hue, the color itself):  0 to 180, the hue in degrees divided by 2
#                               (red ~0 and ~180, green ~60, blue ~120)
#   S (saturation):             0 to 255  (0 = gray/white, 255 = pure color)
#   V (value, brightness):      0 to 255  (0 = black)
# References:
#   - RGB to HSV in OpenCV (H = hue/2 for 8-bit images):
#     https://docs.opencv.org/4.x/de/d25/imgproc_color_conversions.html
#   - Picking a color with a range in HSV (cv::inRange):
#     https://docs.opencv.org/4.x/da/d97/tutorial_threshold_inRange.html
#
# Red and pink are measured on the real plates under the light of the lab:
# red in camera_2110_091753 (H 179-2, S 190-255), pink in view_2110_095201
# (H 176-2, S 130-175, V ~217). Pink has the same hue as red, so only S
# tells them apart (pink is less saturated).
# Blue is a starting value, NOT measured: the hue from the color circle
# (blue 240 deg -> H 120), and S_min / V_min chosen to keep gray, white and
# black out. Set it with view_cloud (key of each color, see below).
#   S_min keeps gray, white and the points with no color (NO_COLOR_RGB,
#   color_cloud.h, S = 0) out. V_min keeps very dark points out.
#   If H_min > H_max the range wraps around 180 (red: 172 to 8).
#
# key: the key that shows only this color in view_cloud ("colors" window).
# It must not be a key of the PCL viewer: w s j c f e q g u o l x h, the
# numbers and + -; n and t are ours ("no mask", depth filter on/off).
# r and p are PCL keys too, but they are allowed: r also resets the camera
# of that window and p also switches to points (the cloud is already drawn
# with points).
# Free letters: a b d i k m v y z.
#
# name   key   H_min H_max   S_min S_max   V_min V_max
blue      b     100   130      80   255      40   255
red       r     172     8     190   255      70   255
pink      p     170     8     110   185     100   255
